<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaultly</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#070B14;color:#E2E8F0;max-width:480px;margin:0 auto;padding-bottom:120px}
.header{padding:20px;background:linear-gradient(180deg,#0B1120 0%,transparent 100%);position:sticky;top:0;z-index:30}
.logo{font-size:24px;font-weight:900;background:linear-gradient(120deg,#38BDF8,#818CF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.date{font-size:11px;color:#334155;margin-top:2px}
.content{padding:0 20px}
.balance-card{background:linear-gradient(135deg,#0F2027,#203A43,#2C5364);border-radius:24px;padding:26px 24px;margin-bottom:18px}
.balance-label{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.balance-amount{font-size:40px;font-weight:900;color:#38BDF8;letter-spacing:-1px}
.balance-row{display:flex;margin-top:20px;border-top:1px solid rgba(255,255,255,.07);padding-top:16px}
.balance-item{flex:1;text-align:center;border-right:1px solid rgba(255,255,255,.07)}
.balance-item:last-child{border-right:none}
.balance-item-label{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1px;margin-bottom:4px}
.balance-item-value{font-size:15px;font-weight:700}
.savings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.savings-card{border-radius:18px;padding:16px}
.section-title{font-size:11px;font-weight:600;color:#334155;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:14px}
.cat-row{margin-bottom:12px}
.cat-header{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px}
.progress-bar{height:4px;background:rgba(255,255,255,.05);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;border-radius:10px;transition:width .8s ease}
.transaction{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-desc{font-size:14px;font-weight:500}
.tx-sub{font-size:11px;color:#334155;margin-top:2px}
.tx-amount{font-size:15px;font-weight:700;margin-left:auto;flex-shrink:0}
.mic-area{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:35}
.mic-btn{width:72px;height:72px;border-radius:50%;border:none;font-size:28px;cursor:pointer;transition:all .3s ease}
.mic-label{font-size:10px;color:#1E293B;letter-spacing:1px;text-transform:uppercase}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:440px;background:rgba(7,11,20,.96);border-radius:18px;padding:14px 18px;text-align:center;z-index:40;display:none}
.alert{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:14px;padding:11px 15px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Vaultly</div>
  <div class="date" id="dateLabel"></div>
</div>

<div class="content">
  <div class="balance-card">
    <div class="balance-label">Available Balance</div>
    <div class="balance-amount" id="balanceAmt">$0.00</div>
    <div class="balance-row">
      <div class="balance-item"><div class="balance-item-label">INCOME</div><div class="balance-item-value" style="color:#4ADE80" id="incTotal">+$0.00</div></div>
      <div class="balance-item"><div class="balance-item-label">SPENT</div><div class="balance-item-value" style="color:#F87171" id="expTotal">-$0.00</div></div>
      <div class="balance-item"><div class="balance-item-label">SAVED</div><div class="balance-item-value" style="color:#38BDF8" id="savTotal">↑$0.00</div></div>
    </div>
  </div>

  <div id="alertsArea"></div>

  <div class="savings-grid">
    <div class="savings-card" style="background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.2)">
      <div style="font-size:22px;margin-bottom:8px">🆘</div>
      <div style="font-size:11px;color:#64748B;margin-bottom:3px">Emergency Fund</div>
      <div style="font-size:20px;font-weight:700;color:#F87171" id="emergAmt">$0.00</div>
      <div style="font-size:10px;color:#475569;margin:2px 0 8px">goal $5,000.00</div>
      <div style="height:4px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden"><div id="emergBar" style="height:100%;background:#F87171;border-radius:10px;width:0%;transition:width .8s ease"></div></div>
    </div>
    <div class="savings-card" style="background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.15)">
      <div style="font-size:22px;margin-bottom:8px">📈</div>
      <div style="font-size:11px;color:#64748B;margin-bottom:3px">Investments</div>
      <div style="font-size:20px;font-weight:700;color:#34D399" id="investAmt">$0.00</div>
      <div style="font-size:10px;color:#475569;margin:2px 0 8px">goal $10,000.00</div>
      <div style="height:4px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden"><div id="investBar" style="height:100%;background:#34D399;border-radius:10px;width:0%;transition:width .8s ease"></div></div>
    </div>
  </div>

  <div class="section-title">Spending by Category</div>
  <div id="catsArea"></div>

  <div class="section-title" style="margin-top:20px">Recent Transactions</div>
  <div id="txArea"><div style="color:#334155;font-size:13px;padding:12px 0">No transactions yet. Tap the mic and say something!</div></div>
</div>

<div class="toast" id="toast"><div id="toastMsg"></div></div>

<div class="mic-area">
  <button class="mic-btn" id="micBtn" onclick="toggleMic()" style="background:linear-gradient(135deg,#38BDF8,#818CF8);box-shadow:0 8px 28px rgba(56,189,248,.25)">🎙️</button>
  <div class="mic-label" id="micLabel">Tap to speak</div>
</div>

<script>
const API_KEY = "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";

const CATS = {
  food:{label:"Food & Dining",icon:"🍔",color:"#FF6B6B"},
  gas:{label:"Gas & Fuel",icon:"⛽",color:"#FFB347"},
  groceries:{label:"Groceries",icon:"🛒",color:"#6EE7B7"},
  bills:{label:"Bills & Utilities",icon:"🧾",color:"#93C5FD"},
  entertainment:{label:"Entertainment",icon:"🎬",color:"#C4B5FD"},
  health:{label:"Health",icon:"🏥",color:"#FCA5A5"},
  transport:{label:"Transport",icon:"🚌",color:"#FDE68A"},
  shopping:{label:"Shopping",icon:"🛍️",color:"#6EE7B7"},
  other:{label:"Other",icon:"📦",color:"#9CA3AF"}
};

const BUDGETS = {food:300,gas:150,groceries:400,bills:500,entertainment:100,health:200,transport:100,shopping:200,other:100};

let transactions = JSON.parse(localStorage.getItem('vaultly_tx') || '[]');
let recognition = null;
let listening = false;

document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'});

function fmt(n){return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(d){return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});}

function save(){localStorage.setItem('vaultly_tx',JSON.stringify(transactions));}

function render(){
  const expenses = transactions.filter(t=>t.type==='expense');
  const incomes  = transactions.filter(t=>t.type==='income');
  const savings  = transactions.filter(t=>t.type==='savings');
  const totalExp = expenses.reduce((s,t)=>s+t.amount,0);
  const totalInc = incomes.reduce((s,t)=>s+t.amount,0);
  const totalEmerg = savings.filter(t=>t.savingsType==='emergency').reduce((s,t)=>s+t.amount,0);
  const totalInvest = savings.filter(t=>t.savingsType==='investment').reduce((s,t)=>s+t.amount,0);
  const balance = totalInc - totalExp - totalEmerg - totalInvest;

  document.getElementById('balanceAmt').textContent = fmt(balance);
  document.getElementById('balanceAmt').style.color = balance>=0?'#38BDF8':'#F87171';
  document.getElementById('incTotal').textContent = '+'+fmt(totalInc);
  document.getElementById('expTotal').textContent = '-'+fmt(totalExp);
  document.getElementById('savTotal').textContent = '↑'+fmt(totalEmerg+totalInvest);
  document.getElementById('emergAmt').textContent = fmt(totalEmerg);
  document.getElementById('emergBar').style.width = Math.min(totalEmerg/5000*100,100)+'%';
  document.getElementById('investAmt').textContent = fmt(totalInvest);
  document.getElementById('investBar').style.width = Math.min(totalInvest/10000*100,100)+'%';

  const catSpend = {};
  Object.keys(CATS).forEach(k=>catSpend[k]=expenses.filter(t=>t.category===k).reduce((s,t)=>s+t.amount,0));

  let catsHTML = '';
  Object.entries(CATS).forEach(([k,cat])=>{
    const spent=catSpend[k]||0,budget=BUDGETS[k]||0,pct=budget>0?Math.min(spent/budget*100,100):0,over=spent>budget&&budget>0;
    catsHTML+=`<div class="cat-row"><div class="cat-header"><span>${cat.icon} ${cat.label}</span><span style="color:${over?'#F87171':'#475569'}">${fmt(spent)}${budget>0?' / '+fmt(budget):''}</span></div>${budget>0?`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${over?'#F87171':pct>80?'#FCD34D':cat.color}"></div></div>`:''}</div>`;
  });
  document.getElementById('catsArea').innerHTML = catsHTML;

  let alerts = '';
  Object.keys(BUDGETS).forEach(k=>{
    const spent=catSpend[k]||0,pct=spent/BUDGETS[k]*100;
    if(pct>=100) alerts+=`<div class="alert"><span style="font-size:18px">🚨</span><div><div style="font-size:13px;font-weight:600;color:#F87171">Budget exceeded — ${CATS[k]?.label}</div><div style="font-size:11px;color:#475569">${fmt(spent)} of ${fmt(BUDGETS[k])} (${Math.round(pct)}%)</div></div></div>`;
    else if(pct>=80) alerts+=`<div class="alert" style="background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.2)"><span style="font-size:18px">⚠️</span><div><div style="font-size:13px;font-weight:600;color:#FCD34D">Approaching limit — ${CATS[k]?.label}</div><div style="font-size:11px;color:#475569">${fmt(spent)} of ${fmt(BUDGETS[k])} (${Math.round(pct)}%)</div></div></div>`;
  });
  document.getElementById('alertsArea').innerHTML = alerts;

  let txHTML = '';
  if(transactions.length===0){txHTML='<div style="color:#334155;font-size:13px;padding:12px 0">No transactions yet. Tap the mic and say something!</div>';}
  else{transactions.slice(0,10).forEach(t=>{
    const cat=CATS[t.category]||{icon:'📦',label:'Other',color:'#9CA3AF'};
    const color=t.type==='income'?'#4ADE80':t.type==='savings'?cat.color:'#E2E8F0';
    const sign=t.type==='income'?'+':t.type==='savings'?'↑':'−';
    txHTML+=`<div class="transaction"><div class="tx-icon" style="background:${cat.color}18">${cat.icon}</div><div><div class="tx-desc">${t.description}</div><div class="tx-sub">${fmtDate(t.date)} · ${cat.label}</div></div><div class="tx-amount" style="color:${color}">${sign}${fmt(t.amount)}</div></div>`;
  });}
  document.getElementById('txArea').innerHTML = txHTML;
}

function showToast(msg, color='#38BDF8', icon=''){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').innerHTML=icon?`<div style="font-size:26px;margin-bottom:4px">${icon}</div><div style="font-size:14px;color:#E2E8F0">${msg}</div>`:`<div style="font-size:13px;color:${color}">${msg}</div>`;
  t.style.display='block';t.style.border=`1px solid ${color}44`;
  setTimeout(()=>t.style.display='none',3500);
}

async function processVoice(text){
  showToast('✨ Processing: "'+text+'"','#38BDF8');
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:500,
        system:`Parse financial voice input into JSON only. No markdown.
{"type":"expense"|"income"|"savings","amount":number,"category":"food"|"gas"|"groceries"|"bills"|"entertainment"|"health"|"transport"|"shopping"|"other"|"income"|"emergency"|"investment","description":string,"savingsType":"emergency"|"investment"|null,"message":string}`,
        messages:[{role:'user',content:text}]
      })
    });
    const data=await res.json();
    const raw=data.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim();
    const p=JSON.parse(raw);
    const newT={id:Date.now(),date:new Date().toISOString(),description:p.description,amount:p.amount,type:p.type,category:p.category,savingsType:p.savingsType||null};
    transactions.unshift(newT);save();render();
    const icons={income:'💵',emergency:'🆘',investment:'📈'};
    const icon=icons[p.type]||icons[p.savingsType]||CATS[p.category]?.icon||'💸';
    showToast(p.message,CATS[p.category]?.color||'#38BDF8',icon);
  }catch(e){showToast('Could not process. Try again.','#F87171');}
}

function toggleMic(){
  if(listening){recognition&&recognition.stop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Voice not supported. Try Chrome.','#F87171');return;}
  recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';
  let final='';
  recognition.onstart=()=>{listening=true;document.getElementById('micBtn').style.background='linear-gradient(135deg,#7C3AED,#4338CA)';document.getElementById('micBtn').textContent='⏹';document.getElementById('micLabel').textContent='Tap to stop';};
  recognition.onresult=e=>{final=Array.from(e.results).map(x=>x[0].transcript).join('');showToast('Hearing: "'+final+'"','#818CF8');};
  recognition.onend=()=>{listening=false;document.getElementById('micBtn').style.background='linear-gradient(135deg,#38BDF8,#818CF8)';document.getElementById('micBtn').textContent='🎙️';document.getElementById('micLabel').textContent='Tap to speak';if(final.trim())processVoice(final);};
  recognition.onerror=()=>{listening=false;document.getElementById('micBtn').style.background='linear-gradient(135deg,#38BDF8,#818CF8)';document.getElementById('micBtn').textContent='🎙️';document.getElementById('micLabel').textContent='Tap to speak';showToast('Mic error. Try again.','#F87171');};
  recognition.start();
}

render();
</script>
</body>
</html>
